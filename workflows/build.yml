name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Look up matching Fabric versions for 1.21.11
        run: |
          MC=1.21.11
          YARN=$(curl -sf "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -sf "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -sf -A "nightfall-build" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER fabric-api=$FAPI"
          echo "YARN=$YARN" >> $GITHUB_ENV
          echo "LOADER=$LOADER" >> $GITHUB_ENV
          echo "FAPI=$FAPI" >> $GITHUB_ENV

      - name: Build
        run: gradle build -Pyarn_mappings="$YARN" -Ploader_version="$LOADER" -Pfabric_version="$FAPI" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-jar
          path: build/libs/*.jar
